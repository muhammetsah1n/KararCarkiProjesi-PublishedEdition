<html>

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Karar Çarkı</title>

        <link rel="icon" href="fotograflar/logo.png">
        <link rel="stylesheet" href="anaSayfa.css"> 
        <script src="anaSayfa.js" defer></script> 

    </head>

    <body>

        <header>

            <div class="logo" id="logo">

                <img src="fotograflar/logo.png" height="80" width="82" title="Ana Sayfa">
                <h1>KARAR ÇARKI</h1>

            </div>

            <img src="fotograflar/iletisim.png" height="70" width="72" title="İletişim" class="iletisim" id="iletisim">

        </header>

        <div class="kutu">

            <div class="secenek" id="besliSecenek">

                <img src="fotograflar/besBolmeli.png" height="190" weight="190">
                <h1>5 Bölmeli</h1>

            </div>

            <div class="secenek" id="sekizliSecenek">

                <img src="fotograflar/sekizBolmeli.png" height="190" weight="190">
                <h1>8 Bölmeli</h1>

            </div>

            <div class="secenek" id="ozelSecenek">

                <div class="ozelCarkGorseli">

                    <div class="cizgi"></div>
                    <div class="cizgi"></div>
                    <div class="cizgi"></div>
                    <div class="cizgi"></div>
                    <div class="cizgi"></div>
                    <div class="cizgi"></div>
                    <h1>?</h1>

                </div>
                <h1>Özel Çark</h1>

            </div>

        </div>

        <div class="mesaj">
            <i><b>Kullanmak İstediğiniz Çarkı Seçiniz</b></i>
        </div>

        <div class="popup" id="popup">

            <div class="sonucKutusu" id="sonucKutusu">

                <div class="closeButton" id="closeButton">&times;</div>
                <div class="sonucMetni" id="sonucMetni">Kaç adet girdi girmek istiyorsunuz?</div>

                <div class="sayiSatiri">
                    <input type="text" inputmode="numeric" maxlength="2" placeholder="2 - 12" class="sayiGirdisi" id="sayiGirdisi" autocomplete="off">
                    <button id="devamButonu">Devam</button>
                </div>

            </div>

        </div>

    </body>

</html>
